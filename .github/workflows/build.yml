name: Build release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 = glibc 2.35，兼容 Debian 12 (2.36) / Ubuntu 22.04+
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: tryingopen2api-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: tryingopen2api-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: tryingopen2api-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            target/${{ matrix.target }}/release/tryingopen2api
            target/${{ matrix.target }}/release/tryingopen2api.exe
          if-no-files-found: error
